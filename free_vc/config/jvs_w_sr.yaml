hydra:
  run:
    dir: logs
  job:
    chdir: false  # 作業ディレクトリを変更しない（既存スクリプトとの互換性のため）

# ===== パス設定 =====
path:
  # コーパス
  corpus_dir: "../corpus/jvs_ver1"

  # データセット（特徴量の出力先）
  feature_dir: "./output/feature"
  wav_16k_dir: "${path.feature_dir}/jvs-16k"
  wav_22k_dir: "${path.feature_dir}/jvs-22k"
  wavlm_dir: "${path.feature_dir}/wavlm"
  spk_dir: "${path.feature_dir}/spk"
  sr_wav_dir: "${path.feature_dir}/sr/wav"
  sr_wavlm_dir: "${path.feature_dir}/sr/wavlm"

  # ファイルリスト
  filelist_dir: "./output/filelists"
  training_files: "${path.filelist_dir}/jvs_train.txt"
  validation_files: "${path.filelist_dir}/jvs_val.txt"
  test_files: "${path.filelist_dir}/jvs_test.txt"

  # 事前学習済みモデル
  wavlm_ckpt: "./wavlm/WavLM-Large.pt"
  spk_encoder_ckpt: "./speaker_encoder/ckpt/pretrained_bak_5805000.pt"
  hifigan_config: "./hifigan/config.json"
  hifigan_ckpt: "./hifigan/g_02500000"
  pretrained_model_dir: "./model"

  # 出力
  log_dir: "./logs"
  model_dir: "${path.log_dir}/jvs_w_sr"
  output_dir: "./output"

  # 推論
  pretrained_ckpt: "${path.pretrained_model_dir}/jvs_w_sr/G_50000.pth"
  trained_ckpt: "${path.model_dir}/G_50000.pth"
  convert_txt: "./convert_jvs.txt"
  eval_dir: "${path.output_dir}/eval"

# ===== データ設定 =====
data:
  max_wav_value: 32768.0
  sampling_rate: 16000
  filter_length: 1280
  hop_length: 320
  win_length: 1280
  n_mel_channels: 80
  mel_fmin: 0.0
  mel_fmax: null

# ===== モデル設定 =====
model:
  inter_channels: 192
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0.1
  resblock: "1"
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes:
    - [1, 3, 5]
    - [1, 3, 5]
    - [1, 3, 5]
  upsample_rates: [10, 8, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [16, 16, 4, 4]
  n_layers_q: 3
  use_spectral_norm: false
  gin_channels: 256
  ssl_dim: 1024
  use_spk: true

# ===== 学習設定 =====
train:
  log_interval: 200
  eval_interval: 10000
  seed: 1234
  epochs: 10000
  learning_rate: 2e-4
  betas: [0.8, 0.99]
  eps: 1e-9
  batch_size: 256
  fp16_run: false
  lr_decay: 0.999875
  segment_size: 8960
  init_lr_ratio: 1
  warmup_epochs: 0
  c_mel: 45
  c_kl: 1.0
  use_sr: true
  max_speclen: 128
  port: "8001"

# ===== 前処理設定 =====
preprocess:
  downsample:
    sr1: 16000
    sr2: 22050
    subsets:
      - parallel100
      - nonpara30
    wav_subdir: "wav24kHz16bit"
    extensions:
      - ".wav"
  sr_augmentation:
    min: 68
    max: 92
