[project]
name = "seed-vc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "accelerate",
    "scipy==1.13.1",
    "librosa==0.10.2",
    "huggingface-hub>=0.28.1",
    "munch==4.0.0",
    "einops==0.8.0",
    "descript-audio-codec==1.0.0",
    "gradio==5.23.0",
    "pydub==0.25.1",
    "resemblyzer",
    "jiwer==3.0.3",
    "transformers==4.46.3",
    "FreeSimpleGUI==5.1.1",
    "soundfile==0.12.1",
    "sounddevice==0.5.0",
    "modelscope==1.18.1",
    "funasr==1.1.5",
    "numpy==1.26.4",
    "pyyaml",
    "python-dotenv",
    "hydra-core==1.3.2",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
]
mac = [
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv]
conflicts = [
    [
        { extra = "cuda" },
        { extra = "mac" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cu126", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cu126", extra = "cuda" },
]
